name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SSH_HOST: 59.110.162.252
  SSH_USER: root
  DEPLOY_PATH: /home/docker/frontend

jobs:
  deploy:
    name: Build and deploy static files
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build frontend
        run: |
          set -eu
          npm ci
          npm run build

      - name: Upload dist and reload Nginx
        run: |
          set -eu
          key_file="$RUNNER_TEMP/deploy_key"
          umask 077
          cat > "$key_file" <<'EOF'
          -----BEGIN OPENSSH PRIVATE KEY-----
          b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
          QyNTUxOQAAACAxyqwKWX4LF8UHml5G6iXhgGJLW0i1JjkKiW5l1c7tdwAAAJiDvGE6g7xh
          OgAAAAtzc2gtZWQyNTUxOQAAACAxyqwKWX4LF8UHml5G6iXhgGJLW0i1JjkKiW5l1c7tdw
          AAAEBILDnCxUYkcVFBCW0SsvOFT3b6/5k7WYMkIemmRPQ5+zHKrApZfgsXxQeaXkbqJeGA
          YktbSLUmOQqJbmXVzu13AAAAEWdpdGh1Yi1kZXBsb3kta2V5AQIDBA==
          -----END OPENSSH PRIVATE KEY-----
          EOF

          tar -C dist -czf - . | ssh \
            -i "$key_file" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "set -eu
             mkdir -p '$DEPLOY_PATH/dist' /tmp/renai-frontend
             rm -rf /tmp/renai-frontend/*
             tar -xzf - -C /tmp/renai-frontend
             find '$DEPLOY_PATH/dist' -mindepth 1 -maxdepth 1 -exec rm -rf {} +
             cp -a /tmp/renai-frontend/. '$DEPLOY_PATH/dist/'
             docker exec nginx nginx -t
             docker exec nginx nginx -s reload"
